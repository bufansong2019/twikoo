#:schema node_modules/wrangler/config-schema.json
name = "twikoo"
main = "src/index.js"
compatibility_flags = ["nodejs_compat"]
compatibility_date = "2024-09-23"

[[d1_databases]]
binding = "DB" # available in your Worker on env.DB
database_name = "twikoo-database"
database_id = "43340671-9fb5-47f9-99d6-056d942d9cc5"

[[r2_buckets]]
binding = "R2"
bucket_name = "public-bucket"

[vars]
R2_PUBLIC_URL = "https://public.f1sh.org"

[dev]
port = 5000
